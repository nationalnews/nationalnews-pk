name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate news.json, build all pages, generate RSS + sitemap, check links
        run: npm run build

      - name: Submit changed URLs to IndexNow (Bing, Seznam, Yandex)
        run: node scripts/indexnow-submit.js
        continue-on-error: true

      - name: Upload built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
