name: Copilot CLI diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check Copilot CLI availability
        run: |
          which copilot && copilot --version || echo "copilot not preinstalled"
          npm install --global @github/copilot@latest 2>&1 | tail -2
          copilot --version

      - name: Test inference via GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(copilot -p "Reply with exactly: WORKS" -s --no-ask-user 2>&1)
          CODE=$?
          echo "exit=$CODE"
          echo "output: $OUT" | tail -6
